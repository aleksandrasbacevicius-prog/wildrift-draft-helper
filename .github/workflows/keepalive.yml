# Render's free plan puts the app to sleep after 15 idle minutes, and waking it takes 30-60 s.
# A light request every 10 minutes keeps it awake. One always-on service fits in the 750 free hours a month.
# GitHub may run scheduled jobs a few minutes late, so an occasional cold start can still happen.
name: Keep awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        env:
          APP_URL: ${{ vars.APP_URL || 'https://wildrift-draft-helper.onrender.com' }}
        run: curl --fail --silent --show-error --max-time 90 --retry 2 "$APP_URL/api/meta" -o /dev/null
