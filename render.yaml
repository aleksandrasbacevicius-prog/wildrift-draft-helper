services:
  - type: web
    name: wildrift-draft-helper
    runtime: docker
    plan: free
    healthCheckPath: /api/meta
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_TOKENS
        sync: false
      - key: AI_BUILD_LIMIT
        value: "5"
      - key: AI_GLOBAL_LIMIT
        value: "30"
      - key: AI_WINDOW_HOURS
        value: "48"
